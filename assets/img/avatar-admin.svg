<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="admin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="admin-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="60" fill="url(#admin-bg)"/>
  
  <!-- Subtle pattern / aura -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- User Head & Shoulders -->
  <circle cx="60" cy="46" r="20" fill="#E2E8F0"/>
  <path d="M26 102 C26 78 40 68 60 68 C80 68 94 78 94 102 Z" fill="#CBD5E1"/>

  <!-- Admin Role Badge (Shield with Check/Star) at bottom right -->
  <g transform="translate(74, 74)">
    <circle cx="18" cy="18" r="18" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    <path d="M18 7 L27 11 V18 C27 23 23 27 18 29 C13 27 9 23 9 18 V11 Z" fill="url(#admin-badge)"/>
    <path d="M15 18 L17.5 20.5 L22 15" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
